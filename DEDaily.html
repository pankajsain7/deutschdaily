<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6f2">
  <meta name="description" content="Leben in Deutschland üben. 310 BAMF-Fragen für Baden-Württemberg und ein Probetest mit 33 Fragen.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DeutschDaily">
  <title>Leben in Deutschland – DeutschDaily</title>
  <link rel="icon" href="src/assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="src/assets/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="src/styles.css?v=lid-themen-20261122">
  <link rel="stylesheet" href="src/styles/pwa.css?v=1">
</head>

<body>

  <div class="dashboard-layout">
    <header class="lid-masthead">
      <div class="lid-masthead-inner">
        <img src="src/assets/logo.svg" width="26" height="26" alt="">
        <span>DeutschDaily</span>
        <button type="button" class="lid-app-button" id="app-install" hidden>App installieren</button>
      </div>
    </header>
    <aside class="sidebar">
      <div class="sidebar-logo-wrap">
        <button class="sidebar-logo" onclick="nav('leben-in-deutschland')" type="button" aria-label="DeutschDaily – Startseite" data-aria-en="DeutschDaily home" data-aria-de="DeutschDaily – Startseite">
          <img class="sidebar-logo-mark" src="src/assets/logo.svg" width="32" height="32" alt="">
          <span class="sidebar-logo-text">Deutsch<em>Daily</em></span>
        </button>
        <div class="sidebar-tagline" data-text-en="Your daily German practice" data-text-de="Täglich Deutsch üben">Your daily German practice</div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="nav-desktop">
        <button class="nb" id="nb-leben-in-deutschland" onclick="nav('leben-in-deutschland')" type="button" lang="de"><span class="nb-icon-wrap" data-icon="landmark"></span>Leben in Deutschland</button>
        <div class="sidebar-section-label" data-text-en="Learn" data-text-de="Lernen">Learn</div>
        <button class="nb" id="nb-today" onclick="nav('today')"><span class="nb-icon-wrap" data-icon="today"></span><span data-text-en="Today" data-text-de="Heute">Today</span></button>
        <button class="nb" id="nb-practice" onclick="nav('practice')"><span class="nb-icon-wrap" data-icon="layers"></span><span data-text-en="Practice" data-text-de="Üben">Practice</span><span class="nav-due-badge" hidden></span></button>
        <button class="nb" id="nb-words" onclick="nav('frequency')"><span class="nb-icon-wrap" data-icon="vocab"></span><span data-text-en="Vocabulary" data-text-de="Wortschatz">Vocabulary</span></button>
        <button class="nb" id="nb-browse" onclick="nav('browse')"><span class="nb-icon-wrap" data-icon="sentences"></span><span data-text-en="Sentences" data-text-de="Sätze">Sentences</span></button>
        <div class="sidebar-section-label" data-text-en="Track" data-text-de="Lernstand">Track</div>
        <button class="nb" id="nb-library" onclick="nav('saved')"><span class="nb-icon-wrap" data-icon="library"></span><span data-text-en="Library" data-text-de="Bibliothek">Library</span></button>
        <button class="nb" id="nb-progress" onclick="nav('progress')"><span class="nb-icon-wrap" data-icon="progress"></span><span data-text-en="Progress" data-text-de="Fortschritt">Progress</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-stat">
          <div class="sfs-icon" data-icon="target"></div>
          <div><div class="sfs-val" id="sb-learned-count">0</div><div style="font-size:11px;color:var(--text-3)" id="sb-learned-lbl">sentences learned</div></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="hdr">
        <div class="hdr-in">
          <div class="hdr-mid">
            <div class="pbar-bg">
              <div class="pbar-fill" id="hpf" style="width:0%"></div>
            </div>
            <div class="pbar-lbl" id="hpl">0 / 0 sentences learned</div>
          </div>
          <button class="streak-pill" id="stk" onclick="nav('progress')" type="button" title="Day streak"><span
              data-icon="flame"></span><span id="stk-n">0</span><span class="sr-only">day streak</span></button>
        </div>
      </div>

      <div class="app-content" id="root"></div>
    </main>

    <nav class="mobile-nav">
      <button class="mnb" id="mnb-leben-in-deutschland" onclick="nav('leben-in-deutschland')" type="button" lang="de" aria-label="Leben in Deutschland"><span class="mnb-icon" data-icon="landmark"></span>LiD</button>
    </nav>
  </div>

  <dialog id="app-install-dialog" class="lid-install-dialog" aria-labelledby="app-install-heading" lang="de">
    <div class="lid-install-header">
      <h2 id="app-install-heading">DeutschDaily als App</h2>
      <form method="dialog"><button type="submit" class="lid-button lid-install-close" aria-label="Schließen" autofocus>×</button></form>
    </div>
    <p id="app-offline-status" class="lid-offline-status" role="status">Offline-Inhalte werden vorbereitet …</p>
    <button id="app-offline-retry" class="lid-button" type="button" hidden>Offline-Inhalte erneut laden</button>
    <div id="app-install-guide" class="lid-install-section">
      <p id="app-install-steps"></p>
    </div>
    <p id="app-sync-status" class="lid-offline-status" role="status" hidden></p>
    <section class="lid-install-section" aria-labelledby="app-backup-heading">
      <h3 id="app-backup-heading">Lernstand sichern</h3>
      <p>Mit einer Sicherung kannst du deinen Lernstand wiederherstellen.</p>
      <div class="lid-install-actions">
        <button id="app-backup-export" class="lid-button" type="button">Sicherung speichern</button>
        <button id="app-backup-import" class="lid-button" type="button">Sicherung importieren</button>
        <input id="app-backup-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="app-backup-error" class="data-modal-err" role="alert"></p>
    </section>
  </dialog>

  <div class="modal-overlay" id="goal-modal" style="display:none" onclick="closeGoalModal(event)" role="dialog" aria-modal="true" aria-labelledby="goal-modal-title">
    <div class="modal-box">
      <div class="modal-title" id="goal-modal-title">Set Daily Goal</div>
      <div class="modal-sub" id="goal-modal-sub">How many new sentences to learn each day?</div>
      <div class="goal-opts-grid" id="goal-opts"></div>
      <button class="modal-done" onclick="closeGoalModal()">Done</button>
    </div>
  </div>

  <script src="src/content.js?v=history-20260523"></script>
  <script src="src/learning.js?v=history-20260523"></script>
  <script src="src/frequency-dictionary-data.js?v=freq-20260623"></script>
  <script src="src/backup-presets.js?v=20260816"></script>
  <script src="src/storage.js?v=pwa-1"></script>
  <script src="src/lid-catalog.js?v=20261120"></script>
  <script src="src/lid-learning.js?v=sync-1"></script>
  <script src="src/lid-view.js?v=sync-1"></script>
  <script src="src/app.js?v=pwa-1"></script>
  <script src="src/lid-sync.js?v=1"></script>
  <script src="src/pwa.js?v=2"></script>
</body>

</html>
