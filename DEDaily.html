<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#4F46E5">
  <title>DeutschDaily</title>
  <link rel="icon" href="src/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="src/styles.css?v=progress-20260902">
</head>

<body>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-logo-wrap">
        <button class="sidebar-logo" onclick="nav('today')" type="button" aria-label="DeutschDaily home">
          <img class="sidebar-logo-mark" src="src/assets/logo.svg" width="32" height="32" alt="">
          <span class="sidebar-logo-text">Deutsch<em>Daily</em></span>
        </button>
        <div class="sidebar-tagline">Your daily German practice</div>
      </div>
      <div class="sidebar-divider"></div>
      <nav class="nav-desktop" style="flex:1">
        <div class="sidebar-section-label">Learn</div>
        <button class="nb on" id="nb-today" onclick="nav('today')"><span class="nb-icon-wrap" data-icon="today"></span> Today</button>
        <button class="nb" id="nb-practice" onclick="nav('practice')"><span class="nb-icon-wrap" data-icon="layers"></span> Practice<span class="nav-due-badge" hidden></span></button>
        <button class="nb" id="nb-words" onclick="nav('frequency')"><span class="nb-icon-wrap" data-icon="vocab"></span> Vocabulary</button>
        <button class="nb" id="nb-browse" onclick="nav('browse')"><span class="nb-icon-wrap" data-icon="sentences"></span> Sentences</button>
        <div class="sidebar-section-label">Track</div>
        <button class="nb" id="nb-library" onclick="nav('saved')"><span class="nb-icon-wrap" data-icon="library"></span> Library</button>
        <button class="nb" id="nb-progress" onclick="nav('progress')"><span class="nb-icon-wrap" data-icon="progress"></span> Progress</button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-footer-stat">
          <div class="sfs-icon" data-icon="target"></div>
          <div><div class="sfs-val" id="sb-learned-count">0</div><div style="font-size:11px;color:var(--text-3)" id="sb-learned-lbl">sentences learned</div></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="hdr">
        <div class="hdr-in">
          <div class="hdr-mid">
            <div class="pbar-bg">
              <div class="pbar-fill" id="hpf" style="width:0%"></div>
            </div>
            <div class="pbar-lbl" id="hpl">0 / 0 sentences learned</div>
          </div>
          <button class="streak-pill" id="stk" onclick="nav('progress')" type="button" title="Day streak"><span
              data-icon="flame"></span><span id="stk-n">0</span><span class="sr-only">day streak</span></button>
        </div>
      </div>

      <div class="app-content" id="root"></div>
    </main>

    <nav class="mobile-nav">
      <button class="mnb on" id="mnb-today" onclick="nav('today')"><span class="mnb-icon" data-icon="today"></span>Today</button>
      <button class="mnb" id="mnb-practice" onclick="nav('practice')"><span class="mnb-icon" data-icon="layers"></span>Practice<span class="nav-due-badge" hidden></span></button>
      <button class="mnb" id="mnb-words" onclick="nav('frequency')"><span class="mnb-icon" data-icon="vocab"></span>Vocab</button>
      <button class="mnb" id="mnb-library" onclick="nav('saved')"><span class="mnb-icon" data-icon="library"></span>Library</button>
      <button class="mnb" id="mnb-progress" onclick="nav('progress')"><span class="mnb-icon" data-icon="progress"></span>Progress</button>
    </nav>
  </div>

  <div class="modal-overlay" id="goal-modal" style="display:none" onclick="closeGoalModal(event)" role="dialog" aria-modal="true" aria-labelledby="goal-modal-title">
    <div class="modal-box">
      <div class="modal-title" id="goal-modal-title">Set Daily Goal</div>
      <div class="modal-sub" id="goal-modal-sub">How many new sentences to learn each day?</div>
      <div class="goal-opts-grid" id="goal-opts"></div>
      <button class="modal-done" onclick="closeGoalModal()">Done</button>
    </div>
  </div>

  <script src="src/content.js?v=history-20260523"></script>
  <script src="src/learning.js?v=history-20260523"></script>
  <script src="src/frequency-dictionary-data.js?v=freq-20260623"></script>
  <script src="src/backup-presets.js?v=20260816"></script>
  <script src="src/storage.js?v=practice-20260901"></script>
  <script src="src/app.js?v=practice-20260901"></script>
</body>

</html>
